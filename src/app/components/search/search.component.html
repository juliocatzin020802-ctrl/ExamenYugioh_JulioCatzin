<div class="search-container">
  <label for="searchInput" class="sr-only">Buscar carta</label>
  <div class="search-input-group">
    <input
      id="searchInput"
      type="text"
      [formControl]="searchControl"
      placeholder="Ej. Blue-Eyes, Dark Magician, Kuriboh"
      autocomplete="off"
    />
    <button (click)="clear()" [disabled]="!searchControl.value">Limpiar</button>
  </div>
</div>

@if (results$ | async; as state) {
  @if (state.status === 'success') {
    <div class="results-header">
      <p class="results-count">{{ state.data.length }} carta(s) encontrada(s)</p>
    </div>
    
    <div class="card-grid">
      @for (c of state.data | slice:0:visibleCount(); track c.id) { 
        <app-card [card]="c" (cardSelected)="openDetail($event)"></app-card> 
      }
    </div>

    @if (state.data.length > visibleCount()) {
      <div class="show-more-container">
        <button class="show-more-btn" (click)="showMore()">Mostrar más</button>
      </div>
    }
  } @else {
    <app-status-message
      [state]="state"
      idleText="Escribe al menos 2 caracteres para buscar."
      (retry)="onRetry()">
    </app-status-message>
  }
}
